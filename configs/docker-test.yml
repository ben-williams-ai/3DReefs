colour_restoration:
  mode: off
  overwrite: false
  start_sfm_immediately: true

project:
  dir: /scratch/3dreefs/project

tools:
  colmap_bin: /opt/colmap/bin/colmap
  lfs_bin: /opt/lichtfeld-studio/build-release/LichtFeld-Studio
  splat_transform_bin: splat-transform
  vocab_tree_path: /input/vocab_tree.bin
  aliked_n16rot_vocab_tree_path: /input/aliked_n16rot_vocab_tree.bin
  aliked_n32_vocab_tree_path: /input/aliked_n32_vocab_tree.bin

advanced:
  sfm:
    preflight:
      colmap_target_version: "9c23f694"
    intrinsics:
      selection_start_index: 50
      selection_end_index: 60
    feature_extraction:
      max_num_features: 4096
      sift:
        # Default/off baseline. Enable in AIMS-style overrides only after review.
        estimate_affine_shape: true
        domain_size_pooling: true
    matching:
      mode: sequential
      # Default/off baseline. Guided matching is an opt-in AIMS-style setting.
      guided_matching: true
      # Optional cross-camera pair generation for custom COLMAP matching.
      # ordering controls how images are ordered before building pairs:
      #   exif_timestamp: prefer EXIF/PIL-visible timestamps, then natural filenames.
      #   filename: use natural filename order when timestamps are stale or wrong.
      # Pairing assumes aligned, mostly unbroken camera folders trimmed to matching coverage.
      # If images are jumbled or badly offset, keep this disabled and prefer vocab-tree matching.
      cross_camera_pairs:
        enabled: true
        ordering: exif_timestamp
        index_window: 3
        scratch_preview_count: 50
        run_matching_pass: true
      sequential:
        # Default: 30. Neighbouring sequence images to match.
        overlap: 30
    reconstruction:
      backend: global
    sparse_refinement:
      # Default: true. AIMS-style COLMAP triangulate/filter/analyse loop.
      enabled: true
      repeats: 2
      allow_fallback: false
    dense:
      enabled: false
      patch_match:
        max_image_size: -1
        geom_consistency: false
      fusion:
        min_num_pixels: 5
        max_reproj_error: 2
        max_depth_error: 0.01
        max_normal_error: 10
      mesh:
        enabled: false
        method: delaunay
        poisson_depth: 13
  splat:
    train:
      num_iters: 500
      num_splats_per_patch: 200000
      lfs_config: /opt/lichtfeld-studio/eval/mcmc_optimization_params.json
    patching:
      max_cameras: 400
      external_support_fraction: 0.10
      buffer: 0.1
    cleanup:
      enabled: true
      max_area: 0.004
      min_neighbors: 20
      radius: 0.05
      filter_boundaries: true
      boundary_buffer: 0.1
      patch_ids: null
    merge:
      enabled: true
      require_cleaned: true
      continue_with_available: true
      output_name: merged_splat.ply
      patch_ids: null
    sog:
      enabled: true
      source: merged
      output_name: merged_splat.sog
      filter_nan: true
      filter_harmonics: 2
      iterations: null

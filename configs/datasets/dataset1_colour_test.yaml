# Dataset 1 full-pipeline colour-restoration test.
#
# The project directory is intentionally separate from data/dataset1 so this can
# behave like a fresh user project while raw_images/ is symlinked locally.
colour_restoration:
  mode: manual
  overwrite: false
  start_sfm_immediately: false

project:
  dir: data/dataset1_colour_test

tools:
  colmap_bin: ${COLMAP_BIN}
  lfs_bin: ${LFS_BIN}
  splat_transform_bin: ${SPLAT_TRANSFORM_BIN}
  vocab_tree_path: ${VOCAB_TREE_PATH}

advanced:
  sfm:
    intrinsics:
      camera_model: OPENCV
      precalculate: true
      selection_start_index: 50
      selection_end_index: 150
      preferred_min_images: 100
      refine:
        all: true
        focal_length: false
        principal_point: false
        extra_params: false

    feature_extraction:
      max_image_size: null
      max_num_features: 8192
      sift:
        # Default/off baseline. Enable in AIMS-style overrides only after review.
        estimate_affine_shape: false
        domain_size_pooling: false

    matching:
      mode: sequential_vocab_tree
      # Default/off baseline. Guided matching is an opt-in AIMS-style setting.
      guided_matching: false
      # Optional cross-camera pair generation for custom COLMAP matching.
      # ordering controls how images are ordered before building pairs:
      #   exif_timestamp: prefer EXIF/PIL-visible timestamps, then natural filenames.
      #   filename: use natural filename order when timestamps are stale or wrong.
      # Pairing assumes aligned, mostly unbroken camera folders trimmed to matching coverage.
      # If images are jumbled or badly offset, keep this disabled and prefer vocab-tree matching.
      cross_camera_pairs:
        enabled: false
        ordering: exif_timestamp
        index_window: 1
        scratch_preview_count: 50
        run_matching_pass: false
      sequential:
        # Default: 15. AIMS-style runs can override this to 30.
        overlap: 15

    reconstruction:
      backend: global

    sparse_refinement:
      # Default/off baseline. Optional AIMS-style COLMAP filter/BA/triangulate/analyse loop.
      enabled: false
      repeats: 2
      allow_fallback: false

    undistortion:
      max_image_size: 4096
      image_source: auto

    dense:
      enabled: false

      patch_match:
        # Default: -1. Use COLMAP's original dense image size.
        max_image_size: -1
        # Default: false. Use photometric PatchMatch for dense comparison outputs.
        geom_consistency: false

      fusion:
        min_num_pixels: 5
        max_reproj_error: 2
        max_depth_error: 0.01
        max_normal_error: 10

      mesh:
        enabled: false
        method: delaunay
        poisson_depth: 13

  splat:
    patching:
      max_cameras: 400
      external_support_fraction: 0.10
      buffer: 0.1

    train:
      num_iters: 30000
      num_splats_per_patch: 2000000
      strategy: mcmc
      headless: true

    cleanup:
      enabled: true
      max_area: 0.004
      min_neighbors: 20
      radius: 0.05
      filter_boundaries: true
      boundary_buffer: 0.1

    merge:
      enabled: true
      require_cleaned: true
      continue_with_available: true
      output_name: merged_splat.ply

    sog:
      enabled: true
      source: merged
      output_name: merged_splat.sog
      filter_nan: true
      filter_harmonics: 2

# Mandatory settings
project:
  # Required. Dataset/project directory containing raw_images/.
  # Public examples must use placeholders, not private local paths.
  dir: data/dataset1
  # Default: false. When true, recoloured_images/ must mirror raw_images/.
  recolour_images: false
  # Default: true. When recolour_images is true, raw-image SfM may run while the colour GUI is open.
  start_sfm_immediately: true

tools:
  # Add the paths to each tool here or in a .env file (see .env.example).
  # Target: COLMAP 4.0.4. May be overridden locally.
  colmap_bin: ${COLMAP_BIN}
  # Target: LichtFeld Studio v0.5.2. May be overridden locally.
  lfs_bin: ${LFS_BIN}
  # Required when cleanup, merge, or SOG post-processing is enabled.
  splat_transform_bin: ${SPLAT_TRANSFORM_BIN}
  # Required when SfM matching uses vocabulary-tree retrieval.
  vocab_tree_path: ${VOCAB_TREE_PATH}

# Advanced settings
advanced:
  paths:
    # Default: raw_images under project.dir.
    raw_images_dir: raw_images
    # Default: recoloured_images under project.dir.
    recoloured_images_dir: recoloured_images
    # Default: runs under project.dir.
    runs_dir: runs

  logging:
    # Default: true. Write human-readable orchestration log.
    pipeline_log: true
    # Default: true. Write warnings log.
    warnings_log: true

  resume:
    # Default: prompt. Prompt in interactive runs; fail in non-interactive runs.
    mode: prompt
    # Default: true. Compare previous and requested effective config before running.
    compare_effective_config: true
    # Default: true. Require an explicit decision when config differs.
    require_decision_on_config_diff: true

  sfm:
    camera_config:
      # Default: auto. Infer single-camera or multi-camera from raw_images layout.
      mode: auto
      # Default: null. Optional explicit mapping such as {cam1: cam1, cam2: cam2}.
      camera_mapping: null

    preflight:
      # Default: true. Fail early if a camera group contains mixed dimensions.
      check_dimensions: true
      # Default: true. Report camera-source consistency when metadata is available.
      check_camera_source_metadata: true
      # Default: false. Use only after manually checking mixed-source warnings.
      proceed_on_mixed_camera_sources: false
      # Default: false. Underwater datasets should not rely on EXIF GPS/pose priors.
      exif_pose_priors_enabled: false
      # Default: true. Validate GPU-capable stage support where possible.
      validate_gpu_support: true

    intrinsics:
      # Default: OPENCV. Ignored when cameras_txt is provided.
      camera_model: OPENCV
      # Default: true. Record pre-calculation image selection unless cameras_txt is provided.
      precalculate: true
      # Default: null. Optional COLMAP cameras.txt; overrides default intrinsics handling.
      cameras_txt: null
      # Default: We take images 50-150 for intrinsics as this likely skips erratic
      # camera motion at the start of a sequence. If <150 images are available,
      # the pipeline automatically uses earlier images in the sequence.
      # Ignored when cameras_txt is provided.
      selection_start_index: 50
      selection_end_index: 150
      # Default: 100. Preferred minimum calibration image count.
      preferred_min_images: 100

      refine:
        # Default: true. If all is true, all intrinsics groups refine in final BA.
        # If all is false, only the individual true switches below refine.
        all: true
        focal_length: false
        principal_point: false
        extra_params: false

    feature_extraction:
      # Default: null. Use raw image dimensions.
      max_image_size: null
      # Default: 8192; protective 4096 is used above 10000 images if not changed.
      max_num_features: 8192
      # Default: true. Use GPU for COLMAP feature extraction where available.
      use_gpu: true
      # Default: -1. Let COLMAP choose GPU.
      gpu_index: -1

    matching:
      # Default: sequential_vocab_tree.
      mode: sequential_vocab_tree
      # Default: true. Use GPU for supported matching stages.
      use_gpu: true
      # Default: -1. Let COLMAP choose GPU.
      gpu_index: -1

      sequential:
        # Default: 15. Neighbouring sequence images to match.
        overlap: 15
        # Default: true. Expand sequential overlap quadratically.
        quadratic_overlap: true

        loop_detection:
          # Default: true. Use vocab-tree loop detection inside sequential matching.
          enabled: true
          period: 10
          num_images: 100
          num_nearest_neighbors: 1
          num_checks: 64

      vocab_tree:
        # Default: 150. Retrieved images per image for vocab-tree matching.
        num_images: 150
        num_nearest_neighbors: 5
        num_checks: 64

      spatial:
        max_num_neighbors: null
        min_num_neighbors: null
        ignore_z: true
        max_distance: null

    reconstruction:
      # Default: global. Uses COLMAP 4.0.4 global_mapper.
      backend: global
      # Default: true. Validate selected backend before reconstruction.
      validate_backend: true
      # Default: true. Use GPU-capable backend options where supported.
      use_gpu: true
      # Default: null. Expert-only validated COLMAP option overrides.
      options: null

    undistortion:
      # Default: 4096. Preserve aspect ratio and keep smaller images smaller.
      max_image_size: 4096
      # Default: auto. Raw unless project.recolour_images=true, then recoloured.
      image_source: auto

    dense:
      # Default: false. Dense outputs are optional comparison artefacts.
      enabled: false

      patch_match:
        max_image_size: 2000
        geom_consistency: true

      fusion:
        min_num_pixels: 5
        max_reproj_error: 2
        max_depth_error: 0.01
        max_normal_error: 10

      mesh:
        # Default: false. Requires dense.enabled=true.
        enabled: false
        poisson_depth: 13

  splat:
    outlier_filter:
      # Default: true. Detect and remove only a small clear minority of bad camera poses before patching.
      enabled: true
      # Default: false. Report proposed removals without changing downstream patching source.
      dry_run: false
      # Default: 0.05. Proposed removals above this fraction stop as ambiguous.
      max_removal_fraction: 0.05
      # Default: iqr. Options: iqr, percentile.
      method: iqr
      # Default: 3.0. IQR multiplier for camera-centre outlier detection.
      iqr_mult: 3.0
      # Default: 99.9. Percentile bound when method is percentile.
      percentile: 99.9

    patching:
      # Default: 800. User-selected maximum cameras per patch; tune for GPU memory and image dimensions.
      max_cameras: 400
      # Default: 0.10. Reserve up to this fraction of max_cameras for neighbouring external support cameras.
      # Useful to have when the outward facing sides of tall objects near the edge of a patch are likely to
      # be missed by internal cameras alone.
      external_support_fraction: 0.10
      # Default: 0.1. Relative scene-coordinate patch buffer, not metres.
      buffer: 0.1
      # Default: false. Optional visual diagnostics helper; not part of unattended default.
      run_interactive_patch_visualiser: false
      # Default: null. Optional selected patch IDs for patch generation.
      patch_ids: null

    train:
      # Default: 30000. Requested LFS iterations for every trained patch.
      num_iters: 30000
      # Default: 1000000. Per-patch splat cap passed to LFS.
      num_splats_per_patch: 2000000
      # Default: mcmc. LFS training strategy.
      strategy: mcmc
      # Default: true. Run LFS without interactive UI.
      headless: true
      # Default: null. Optional LFS --max-width image cap; useful for reducing tile/bucket memory pressure.
      max_width: null
      # Default: null. Train all valid patches when null; otherwise only these IDs.
      patch_ids: null
      # Default: false. Do not automatically retrain missing, failed, or incomplete patches.
      retrain_failed: false
      # Default: 0.80. Below this completion ratio is a severe warning.
      severe_completion_threshold: 0.80
      # Default: null. Optional repo-controlled LFS config profile path or name.
      lfs_config: null

    cleanup:
      # Default: true. Clean trained patch PLYs during splat.postprocess.
      enabled: true
      # Default: 0.004. Scene-relative cleanup setting from the old coral config.
      max_area: 0.004
      # Default: 20. Neighbour-count cleanup setting from the old coral config.
      min_neighbors: 20
      # Default: 0.05. Scene-relative cleanup radius from the old coral config.
      radius: 0.05
      # Default: true. Filter outside patch metadata bounds when available.
      filter_boundaries: true
      # Default: 0.1. Scene-relative patch-boundary buffer, not metres.
      boundary_buffer: 0.1
      # Default: null. Clean all eligible patches when null.
      patch_ids: null

    merge:
      # Default: true. Merge cleaned patch PLYs into one site-level PLY.
      enabled: true
      # Default: true. Do not silently merge raw patch splats.
      require_cleaned: true
      # Default: true. Merge available cleaned patches while warning about exclusions.
      continue_with_available: true
      # Default: merged_splat.ply. Final cleaned site-level PLY filename.
      output_name: merged_splat.ply
      # Default: null. Consider all cleaned patches when null.
      patch_ids: null

    sog:
      # Default: true. Export one final SOG from the merged site-level PLY.
      enabled: true
      # Default: merged. Use the merged cleaned site-level PLY.
      source: merged
      # Default: merged_splat.sog. Final SOG filename.
      output_name: merged_splat.sog
      # Default: true. Pass nan filtering to splat-transform when supported.
      filter_nan: true
      # Default: 2. Harmonics filter passed to splat-transform.
      filter_harmonics: 2
      # Default: null. Use splat-transform default unless overridden.
      iterations: null

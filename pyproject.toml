[project]
name = "3dreefs"
version = "0.1.0"
description = "Reproducible SfM and Gaussian splatting pipeline tools for large coral reef datasets."
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "pycolmap>=4.0.4",
    "pyside6>=6.7",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "torch>=2.3",
    "wildflow>=0.1.5",
    "lpips>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false

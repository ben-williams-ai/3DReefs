# Config Contract: Splat Patching And Training

advanced:
  splat:
    outlier_filter:
      # Default: true. Detect and remove only a small clear minority of bad
      # camera poses before patching.
      enabled: true

      # Default: false. If true, report proposed removals without changing the
      # downstream patching source.
      dry_run: false

      # Default: 0.05. Maximum fraction of cameras that may be auto-removed.
      # Larger proposed removals stop before patching as ambiguous.
      max_removal_fraction: 0.05

      # Default: iqr. Camera-centre outlier detector. Options: iqr, percentile.
      method: iqr

      # Default: 3.0. IQR multiplier for the default detector.
      iqr_mult: 3.0

      # Default: 99.9. Percentile bound when method is percentile.
      percentile: 99.9

    patching:
      # Default: required positive value. Maximum selected cameras per patch.
      # User must choose a value that fits their GPU memory and image dimensions.
      max_cameras: 800

      # Default: 0.1. Relative scene-coordinate patch buffer, not metres.
      buffer: 0.1


      # Default: false. Optional visual diagnostics helper; not part of the
      # unattended default path.
      run_interactive_patch_visualiser: false

      # Default: null. Optional selected patch IDs for patch generation.
      patch_ids: null

    train:
      # Default: 30000. Requested LFS iterations for every trained patch.
      num_iters: 30000

      # Default: 1500000. Per-patch splat cap passed to LFS.
      num_splats_per_patch: 1500000

      # Default: mcmc. LFS training strategy.
      strategy: mcmc

      # Default: true. Run LFS without interactive UI.
      headless: true

      # Default: null. Optional LFS --max-width image cap for reducing
      # image/tile memory pressure; null leaves LFS default image sizing.
      max_width: null

      # Default: null. Train all valid patches when null; otherwise only these IDs.
      patch_ids: null

      # Default: false. Do not automatically retrain missing/failed/incomplete
      # patches unless explicitly enabled.
      retrain_failed: false

      # Default: 0.80. Below this completion ratio is a severe warning.
      severe_completion_threshold: 0.80

      # Default: null. Optional repo-controlled LFS config profile path/name.
      lfs_config: null

Invalid settings:
- Multi-patch LFS concurrency settings are invalid for this feature.
- Target-bin patching settings are invalid for this feature.
- Point-cloud downsampling settings for patch generation are invalid for this
  feature.

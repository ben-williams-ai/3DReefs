output_root: data/experiments/ablations
sfm_timeout_hours: 24
default_patch_size: 400
default_splat_count: 1000000
run_validation_splats_for_sfm: true

validation:
  patch_count: 10
  holdout_fraction: 0.10
  target_image_source: full_resolution_undistorted
  allow_full_resolution_target: true
  # Python computes PSNR/SSIM/LPIPS from saved full-resolution held-out GT/render images.
  # By default SfM writes sfm/undistorted_full_resolution/images; set this only to override that generated path.
  # full_resolution_undistorted_images_dir: /scratch/3dreefs/project/full_resolution_undistorted/images

datasets:
  - name: dataset1
    config: configs/datasets/dataset_01.yml
    project_dir: data/dataset1
  - name: dataset2
    config: configs/datasets/dataset_02.yml
    project_dir: data/dataset2
  - name: dataset3
    config: configs/datasets/dataset_03.yml
    project_dir: data/dataset3
  - name: dataset4
    config: configs/datasets/dataset_04.yml
    project_dir: data/dataset4
  - name: dataset5
    config: configs/datasets/dataset_05.yml
    project_dir: data/dataset5

aims_baseline_overrides: &aims_baseline_overrides
  advanced.sfm.intrinsics.reconstruction_backend: incremental
  advanced.sfm.intrinsics.refine.all: true
  advanced.sfm.intrinsics.refine.focal_length: false
  advanced.sfm.intrinsics.refine.principal_point: false
  advanced.sfm.intrinsics.refine.extra_params: false
  advanced.sfm.feature_extraction.type: SIFT
  advanced.sfm.feature_extraction.max_image_size: null
  advanced.sfm.feature_extraction.max_num_features: 8192
  advanced.sfm.feature_extraction.sift.estimate_affine_shape: true
  advanced.sfm.feature_extraction.sift.domain_size_pooling: true
  advanced.sfm.matching.mode: sequential
  advanced.sfm.matching.guided_matching: true
  advanced.sfm.matching.sequential.overlap: 30
  advanced.sfm.matching.sequential.loop_detection.enabled: true
  advanced.sfm.matching.sequential.loop_detection.num_nearest_neighbors: 5
  advanced.sfm.matching.cross_camera_pairs.enabled: true
  advanced.sfm.matching.cross_camera_pairs.ordering: exif_timestamp
  advanced.sfm.matching.cross_camera_pairs.index_window: 3
  advanced.sfm.matching.cross_camera_pairs.run_matching_pass: true
  advanced.sfm.reconstruction.backend: global
  advanced.sfm.sparse_refinement.enabled: true
  advanced.sfm.sparse_refinement.repeats: 2
  advanced.sfm.sparse_refinement.bundle_adjuster.enabled: false
  advanced.sfm.undistortion.max_image_size: null
  advanced.sfm.undistortion.follow_feature_extraction_max_image_size: true
  advanced.sfm.undistortion.fallback_max_image_size: 4096
  advanced.splat.patching.max_cameras: 400
  advanced.splat.train.num_splats_per_patch: 1000000
  advanced.splat.train.max_width: 4096

sfm_variants:
  - name: sfm_full_sift_global
    description: AIMS baseline, SIFT, full-resolution feature extraction, global mapper.
    sweep_dimensions:
      image_size: full
      feature_type: SIFT
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides

  - name: sfm_2048_sift_global
    description: AIMS baseline, SIFT, 2048px feature extraction and undistortion, global mapper.
    sweep_dimensions:
      image_size: 2048
      feature_type: SIFT
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.max_image_size: 2048

  - name: sfm_1024_sift_global
    description: AIMS baseline, SIFT, 1024px feature extraction and undistortion, global mapper.
    sweep_dimensions:
      image_size: 1024
      feature_type: SIFT
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.max_image_size: 1024

  - name: sfm_full_aliked_global
    description: AIMS baseline, ALIKED, full-resolution feature extraction, global mapper.
    sweep_dimensions:
      image_size: full
      feature_type: ALIKED
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2

  - name: sfm_2048_aliked_global
    description: AIMS baseline, ALIKED, 2048px feature extraction and undistortion, global mapper.
    sweep_dimensions:
      image_size: 2048
      feature_type: ALIKED
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.max_image_size: 2048
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2

  - name: sfm_1024_aliked_global
    description: AIMS baseline, ALIKED, 1024px feature extraction and undistortion, global mapper.
    sweep_dimensions:
      image_size: 1024
      feature_type: ALIKED
      mapper_backend: global
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.max_image_size: 1024
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2

  - name: sfm_full_sift_incremental
    description: AIMS baseline, SIFT, full-resolution feature extraction, incremental mapper.
    sweep_dimensions:
      image_size: full
      feature_type: SIFT
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.reconstruction.backend: incremental

  - name: sfm_2048_sift_incremental
    description: AIMS baseline, SIFT, 2048px feature extraction and undistortion, incremental mapper.
    sweep_dimensions:
      image_size: 2048
      feature_type: SIFT
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.max_image_size: 2048
      advanced.sfm.reconstruction.backend: incremental

  - name: sfm_1024_sift_incremental
    description: AIMS baseline, SIFT, 1024px feature extraction and undistortion, incremental mapper.
    sweep_dimensions:
      image_size: 1024
      feature_type: SIFT
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.max_image_size: 1024
      advanced.sfm.reconstruction.backend: incremental

  - name: sfm_full_aliked_incremental
    description: AIMS baseline, ALIKED, full-resolution feature extraction, incremental mapper.
    sweep_dimensions:
      image_size: full
      feature_type: ALIKED
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2
      advanced.sfm.reconstruction.backend: incremental

  - name: sfm_2048_aliked_incremental
    description: AIMS baseline, ALIKED, 2048px feature extraction and undistortion, incremental mapper.
    sweep_dimensions:
      image_size: 2048
      feature_type: ALIKED
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.max_image_size: 2048
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2
      advanced.sfm.reconstruction.backend: incremental

  - name: sfm_1024_aliked_incremental
    description: AIMS baseline, ALIKED, 1024px feature extraction and undistortion, incremental mapper.
    sweep_dimensions:
      image_size: 1024
      feature_type: ALIKED
      mapper_backend: incremental
    overrides:
      <<: *aims_baseline_overrides
      advanced.sfm.feature_extraction.type: ALIKED
      advanced.sfm.feature_extraction.max_image_size: 1024
      advanced.sfm.feature_extraction.aliked.model: n32
      advanced.sfm.feature_extraction.aliked.max_num_features: 8192
      advanced.sfm.feature_extraction.aliked.min_score: 0.2
      advanced.sfm.reconstruction.backend: incremental

splat_grid:
  training_resolutions: [1024, 2048, full]
  patch_sizes: [200, 400, 800]
  splat_counts: [500000, 1000000, 2000000]
  max_widths: []
  training_image_source: training_undistorted
  eval_target_image_source: full_resolution_undistorted
  eval_steps: [30000]
